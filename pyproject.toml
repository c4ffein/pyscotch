[build-system]
# setuptools >= 77 for PEP 639 licence metadata (license expression + files).
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscotch"
# Single source of truth: pyscotch/_version.py (import-free; read statically via
# the attr directive below). CI stamps it from the release tag before building
# — see scripts/apply_release_version.py — so v7.0.0rc1 -> 7.0.0rc1.
dynamic = ["version"]
description = "Python wrapper for PT-Scotch graph partitioning library"
readme = "README.md"
requires-python = ">=3.12"
# PEP 639: PyScotch is MIT; wheels bundle (and the repo patches/copies parts of)
# Scotch, which is CeCILL-C — the expression and the files below declare both.
license = "MIT AND CECILL-C"
license-files = ["LICENSE", "LICENSES/*"]
authors = [
    {name = "c4ffein"}
]
keywords = ["graph", "partitioning", "scotch", "pt-scotch", "mesh", "ordering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    "numpy>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "hypothesis>=6.0",
    "ruff>=0.8",
    "mypy",
]
report = [
    "jinja2",
    "playwright",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]
interop = [
    "scipy>=1.8",
    "networkx>=2.6",
]
# Distributed (PT-Scotch / Dgraph) interop. mpi4py bridges an existing MPI
# runtime to PyScotch: pass its communicators straight to Dgraph(comm=...).
# It builds against whatever system MPI is present, so it is an opt-in extra,
# not a hard dependency; the bundled zero-dependency mpi.py wrapper remains the
# fallback for the common single-implementation case.
parallel = [
    "mpi4py>=3.1",
]

[project.urls]
Homepage = "https://github.com/c4ffein/pyscotch"
Documentation = "https://github.com/c4ffein/pyscotch"
Repository = "https://github.com/c4ffein/pyscotch"

[project.scripts]
pyscotch = "pyscotch.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["pyscotch*"]

[tool.setuptools.package-data]
# _libs/lib{32,64}/*.so are staged by scripts/build_wheel_libs.sh for binary
# wheels (built with `--build-option=--plat-name=<plat>` so the wheel is tagged
# py3-none-<platform>; see wheels.yml); the globs are no-ops when absent. The
# sdist is package-only: CI asserts it never carries a binary.
pyscotch = [
    "py.typed",
    "native/*.c",
    "_scotch_patches/*.patch",
    "_scotch_patches/Makefile.inc.default",
    "_libs/lib32/*.so",
    "_libs/lib64/*.so",
]

[tool.setuptools.dynamic]
version = {attr = "pyscotch._version.__version__"}

[tool.ruff]
# Same standards as c4ffein/keras-tinygrad: ruff for both lint and format,
# 120-column lines.
line-length = 120
extend-exclude = [
    "external",   # the Scotch submodule (C) and anything a build drops there
    "upstream/reports",  # per-version report data: the auditors' reproducer scripts are evidence, not project code
    "upstream/repro",    # the reproducer kits (auditors' scripts, evidence)
    "docs/out",   # the built site (copies of those scripts end up there)
    "build",      # disposable patched Scotch source copy
    "scotchpy",   # upstream's own bindings, checked out for differential tests
]

[tool.ruff.format]
# Teaching code: the docs examples are display copy whose layout (aligned
# inline comments) is deliberate. Lint still applies to them. Same for the
# Python fences inside markdown (ruff >= 0.16 formats those too): every code
# block in our docs is display copy, so *.md stays hand-laid-out.
exclude = ["docs/site/examples/*", "**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["pyscotch"]
# Keep aliased re-exports (`SCOTCH_X as X`) in one import block instead of one block per name.
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
