[build-system]
requires = ["setuptools>=61", "wheel", "numpy>=1.19.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyscotch"
# Single source of truth: pyscotch/_version.py (import-free; read statically via
# the attr directive below). CI stamps it from the release tag before building
# — see scripts/apply_release_version.py — so v7.0.0rc1 -> 7.0.0rc1.
dynamic = ["version"]
description = "Python wrapper for PT-Scotch graph partitioning library"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "c4ffein"}
]
keywords = ["graph", "partitioning", "scotch", "pt-scotch", "mesh", "ordering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "numpy>=1.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "hypothesis>=6.0",
    "ruff>=0.8",
    "mypy",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]
interop = [
    "scipy>=1.8",
    "networkx>=2.6",
]
# Distributed (PT-Scotch / Dgraph) interop. mpi4py bridges an existing MPI
# runtime to PyScotch: pass its communicators straight to Dgraph(comm=...).
# It builds against whatever system MPI is present, so it is an opt-in extra,
# not a hard dependency; the bundled zero-dependency mpi.py wrapper remains the
# fallback for the common single-implementation case.
parallel = [
    "mpi4py>=3.1",
]

[project.urls]
Homepage = "https://github.com/c4ffein/pyscotch"
Documentation = "https://github.com/c4ffein/pyscotch"
Repository = "https://github.com/c4ffein/pyscotch"

[project.scripts]
pyscotch = "pyscotch.cli:main"

[tool.setuptools.dynamic]
version = {attr = "pyscotch._version.__version__"}

[tool.ruff]
# Same standards as c4ffein/keras-tinygrad: ruff for both lint and format,
# 120-column lines.
line-length = 120
extend-exclude = [
    "external",   # the Scotch submodule (C) and anything a build drops there
    "build",      # disposable patched Scotch source copy
    "scotchpy",   # upstream's own bindings, checked out for differential tests
]

[tool.ruff.format]
# Teaching code: docs examples and the demo runbook are display copy whose
# layout (aligned inline comments) is deliberate. Lint still applies to them.
exclude = ["docs/site/examples/*", "demo/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.isort]
known-first-party = ["pyscotch"]
# Keep aliased re-exports (`SCOTCH_X as X`) in one import block instead of one block per name.
combine-as-imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.7"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
