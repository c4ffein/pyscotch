name: Deploy docs to GitHub Pages

# Renders the hand-rolled docs site (docs/site/build.py) and publishes docs/out
# to GitHub Pages. NO Scotch build: the API-reference page is rendered from the
# committed docs/site/api_data.json, so this needs nothing but Python + a few
# pure-Python packages. A separate workflow (docs-verify.yml) guarantees that
# JSON is not stale.

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Allow one concurrent deploy; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # no submodules: the site needs no Scotch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install doc build dependencies
        run: python -m pip install markdown jinja2 pygments

      - name: Build the site
        run: python docs/site/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
