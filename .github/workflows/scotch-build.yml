name: Build Scotch from CLI (end-to-end)

# THE REPO-SIDE CHECK: installs pyscotch from this checkout (`pip install .`)
# and exercises the FULL `pyscotch scotch build` path in a clean runner — the
# real wheel/sdist user scenario: no submodule, no scotch-builds/, no bundled
# libs. It runs as a MATRIX over the catalogued Scotch versions: each job
# downloads that release from GitLab, compiles it (sequential AND parallel),
# loads + partitions + drives Dgraph under mpirun through the result, with the
# version's quickfix expectation pinned in its matrix entry — quickfixed
# releases must be auto-patched (and export the patched symbol), pristine
# releases must build with no patch at all. Version-specific negative tests
# (e.g. --pristine 7.0.12 must fail with the right diagnosis) hang off matrix
# fields. When a new Scotch lands in the catalog, add one matrix entry here
# AND in pypi-verify.yml (its post-publish twin, which runs the same journey
# but installs pyscotch from the real PyPI index with no checkout — this one
# gates the code before release, that one certifies the published package
# after).
#
# This is the automated counterpart to the unit tests in
# tests/pyscotch_base/test_scotch_build.py (which cover the logic offline).
#
# Note: it fetches from gitlab.inria.fr and relies on the pinned checksums in
# pyscotch/scotch_build.py — if GitLab regenerates an archive, bump the pin
# there (the CLI's --sha256 is the manual override). Two schedules watch for
# that drift: every 6 hours the cheap `tarball-drift` job downloads each
# catalogued archive and compares its sha256 to the pin (seconds, no
# toolchain); Mondays the full build matrix also runs, so a toolchain change
# on ubuntu-latest is caught weekly even when none of our own files changed.

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours — tarball-drift job only (cheap)
    - cron: "30 6 * * 1"   # Mondays 06:30 UTC — drift job + full build matrix
  push:
    branches: [main]
    paths:
      - "pyscotch/scotch_build.py"
      - "pyscotch/_store.py"
      - "pyscotch/libscotch.py"
      - "pyscotch/native/**"
      - "pyscotch/_patches/**"
      - ".github/workflows/scotch-build.yml"
  pull_request:
    paths:
      - "pyscotch/scotch_build.py"
      - "pyscotch/_store.py"
      - "pyscotch/libscotch.py"
      - "pyscotch/native/**"
      - "pyscotch/_patches/**"
      - ".github/workflows/scotch-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tarball-drift:
    name: "Upstream tarball checksums still match the catalog"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download every catalogued archive and compare sha256 to the pin
        # Reads the catalog straight from the checkout (stdlib only; the
        # package's lazy import loads no Scotch). A mismatch means GitLab
        # regenerated or moved an archive: bump the pin in scotch_build.py.
        run: |
          python - <<'PY'
          import hashlib, sys, urllib.request
          sys.path.insert(0, ".")
          from pyscotch.scotch_build import _GITLAB, _KNOWN_VERSIONS
          bad = 0
          for version, pinned in sorted(_KNOWN_VERSIONS.items()):
              url = _GITLAB.format(v=version)
              try:
                  with urllib.request.urlopen(url, timeout=120) as r:
                      got = hashlib.sha256(r.read()).hexdigest()
              except Exception as e:
                  print(f"::error::{version}: download failed: {e}")
                  bad += 1
                  continue
              if got == pinned:
                  print(f"{version}: ok ({got})")
              else:
                  print(f"::error::{version}: checksum drift — pinned {pinned}, got {got} ({url})")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY

  build-scotch:
    name: "Scotch ${{ matrix.scotch }} (quickfix: ${{ matrix.quickfix }})"
    runs-on: ubuntu-latest
    # The full build matrix is heavy (toolchain + MPI install, two Scotch
    # compiles, mpirun). On a schedule it runs only for the Monday cron; the
    # 6-hourly cron fires the tarball-drift job alone.
    if: github.event_name != 'schedule' || github.event.schedule == '30 6 * * 1'
    strategy:
      fail-fast: false
      matrix:
        include:
          # One entry per catalogued Scotch release. Keep in sync with
          # _KNOWN_VERSIONS/_PATCHES in pyscotch/scotch_build.py and with the
          # matrix in pypi-verify.yml — a mismatch here IS the signal (catalog
          # drift, or upstream regenerated/fixed something).
          #
          # Fields:
          #   quickfix        "yes" if the version must be auto-patched
          #   symbol          (quickfix only) suffixed symbol the patch must
          #                   make libscotch.so export
          #   pristine_grep   if set, `--pristine` must FAIL and its output
          #                   must contain this string (the diagnosis)
          - scotch: "7.0.13"
            quickfix: "no"   # first release with our rename-table fix merged upstream
          - scotch: "7.0.12"
            quickfix: "yes"  # rename-table regression; must be auto-patched
            symbol: "SCOTCH_meshBuildElem_64"
            pristine_grep: "SCOTCH_meshBuildElem"
          - scotch: "7.0.11"
            quickfix: "no"
    steps:
      - uses: actions/checkout@v5
        # No submodules: build-scotch downloads its own Scotch source.

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build toolchain (flex >= 2.6.4, bison, zlib, MPI)
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison zlib1g-dev libopenmpi-dev openmpi-bin
          flex --version   # ubuntu-latest ships flex 2.6.4

      - name: Install pyscotch as a pure package (no bundled libs)
        run: |
          rm -rf pyscotch/_libs           # ensure the wheel-bundled path is absent
          python -m pip install --upgrade pip
          pip install numpy mpi4py
          pip install .                   # into site-packages, like a real user

      - name: Prepare an isolated store and workdir
        run: |
          echo "PYSCOTCH_HOME=$RUNNER_TEMP/pshome" >> "$GITHUB_ENV"
          echo "PYSCOTCH_MPI_OVERSUBSCRIBE=1" >> "$GITHUB_ENV"

      - name: doctor on a fresh env (before any build)
        working-directory: ${{ runner.temp }}
        run: pyscotch doctor || true   # informational; may report "no Scotch" and exit 1

      - name: Quickfix catalog lists ${{ matrix.scotch }}
        if: matrix.quickfix == 'yes'
        working-directory: ${{ runner.temp }}
        run: |
          pyscotch scotch patches | grep -q "${{ matrix.scotch }}" \
            || { echo "::error::${{ matrix.scotch }} not listed in the quickfix catalog"; exit 1; }

      - name: Build sequential ${{ matrix.scotch }} and select it
        working-directory: ${{ runner.temp }}
        run: |
          out="$(pyscotch scotch build ${{ matrix.scotch }} --sequential --use 2>&1)"
          echo "$out"
          if [ "${{ matrix.quickfix }}" = "yes" ]; then
            echo "$out" | grep -q "Applied quickfix" \
              || { echo "::error::${{ matrix.scotch }} built without applying the bundled quickfix"; exit 1; }
            pyscotch scotch list | grep "${{ matrix.scotch }}" | grep -q "quickfix" \
              || { echo "::error::${{ matrix.scotch }} build not marked as quickfixed"; exit 1; }
          else
            echo "$out" | grep -q "Applied quickfix" \
              && { echo "::error::${{ matrix.scotch }} unexpectedly applied a quickfix"; exit 1; }
          fi
          pyscotch scotch list
          pyscotch doctor

      - name: Quickfixed library exports the patched symbol
        if: matrix.quickfix == 'yes'
        working-directory: ${{ runner.temp }}
        run: |
          # The patch's whole job: the new symbol is present, correctly suffixed.
          nm -D "$PYSCOTCH_HOME/builds/${{ matrix.scotch }}-64-seq/lib64/libscotch.so" \
            | grep -qw "${{ matrix.symbol }}" \
            || { echo "::error::quickfixed ${{ matrix.scotch }} lacks a defined ${{ matrix.symbol }}"; exit 1; }

      - name: Load + partition through the managed sequential build
        working-directory: ${{ runner.temp }}
        run: |
          # Not just load: actually compute through the managed library.
          python - <<'PY'
          import numpy as np
          from pyscotch import Graph, scotch_version
          expected = tuple(map(int, "${{ matrix.scotch }}".split(".")))
          assert scotch_version() == expected, (scotch_version(), expected)
          g = Graph()
          g.build(np.array([0, 2, 4, 6, 8, 10, 12]),
                  np.array([1, 5, 0, 2, 1, 3, 2, 4, 3, 5, 4, 0]))
          part = g.partition(2)
          assert set(part.tolist()) == {0, 1}, part
          print("sequential managed build OK:", scotch_version())
          PY

      - name: Build parallel ${{ matrix.scotch }} and drive Dgraph under mpirun
        working-directory: ${{ runner.temp }}
        run: |
          # The quickfix (when one applies) must survive the parallel compile
          # too — it touches the rename tables, and PT-Scotch compiles more of
          # the tree — and the result must actually work under mpirun.
          out="$(pyscotch scotch build ${{ matrix.scotch }} --parallel --use 2>&1)"
          echo "$out"
          if [ "${{ matrix.quickfix }}" = "yes" ]; then
            echo "$out" | grep -q "Applied quickfix" \
              || { echo "::error::parallel ${{ matrix.scotch }} built without applying the bundled quickfix"; exit 1; }
          else
            echo "$out" | grep -q "Applied quickfix" \
              && { echo "::error::parallel ${{ matrix.scotch }} unexpectedly applied a quickfix"; exit 1; }
          fi
          pyscotch scotch list
          cat > dgraph_smoke.py <<'PY'
          import os
          os.environ.setdefault("PYSCOTCH_INT_SIZE", "64")
          os.environ.setdefault("PYSCOTCH_PARALLEL", "1")
          from mpi4py import MPI
          from pyscotch import Dgraph, scotch_version
          comm = MPI.COMM_WORLD
          dg = Dgraph(comm=comm)
          dg.build_grid_3d(6, 6, 6)
          assert dg.check()
          part = dg.part(3)
          assert part.min() >= 0 and part.max() < 3
          dg.exit()
          comm.Barrier()
          if comm.Get_rank() == 0:
              print("parallel managed build OK:", scotch_version(), "ranks:", comm.Get_size())
          PY
          PYSCOTCH_INT_SIZE=64 PYSCOTCH_PARALLEL=1 \
            python -c "
          from pyscotch import scotch_version as v
          expected = tuple(map(int, '${{ matrix.scotch }}'.split('.')))
          assert v() == expected, (v(), expected)
          "
          PYSCOTCH_INT_SIZE=64 PYSCOTCH_PARALLEL=1 \
            mpirun --oversubscribe -n 2 python dgraph_smoke.py

      - name: Switching the default changes the loaded library
        working-directory: ${{ runner.temp }}
        run: |
          pyscotch scotch use ${{ matrix.scotch }}-64-seq
          python -c "
          from pyscotch import scotch_version as v
          expected = tuple(map(int, '${{ matrix.scotch }}'.split('.')))
          assert v() == expected, (v(), expected)
          print('use seq ->', v())
          "
          pyscotch scotch rm ${{ matrix.scotch }}-64-seq
          pyscotch scotch list

      - name: --pristine ${{ matrix.scotch }} must fail cleanly with the right diagnosis
        if: matrix.pristine_grep != ''
        working-directory: ${{ runner.temp }}
        run: |
          # Without the quickfix, this version must fail non-zero and name the
          # bug. Deterministic across compilers: build-scotch compiles with
          # -Werror=implicit-function-declaration, so a missing prototype is a
          # hard compile error on every GCC (not just GCC >= 14, which errors
          # by default). The offending symbol is named in the output and
          # nothing is staged.
          set +e
          out="$(pyscotch scotch build ${{ matrix.scotch }} --sequential --pristine --force 2>&1)"
          rc=$?
          set -e
          echo "$out"
          if [ "$rc" -eq 0 ]; then
            echo "::error::--pristine ${{ matrix.scotch }} unexpectedly built (upstream may have fixed it)"
            exit 1
          fi
          echo "$out" | grep -q "${{ matrix.pristine_grep }}" \
            || { echo "::error::--pristine ${{ matrix.scotch }} failure not diagnosed as expected (wanted '${{ matrix.pristine_grep }}')"; exit 1; }
          echo "--pristine ${{ matrix.scotch }} failed cleanly with the expected diagnosis."
