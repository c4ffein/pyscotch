# MPI variants for the pyscotch recipe.
#
# `nompi` builds depend on conda-forge's sequential `scotch`; `openmpi` /
# `mpich` builds depend on `ptscotch` + `mpi4py` for the same MPI and enable
# PYSCOTCH_PARALLEL=1 (the Dgraph class). conda-build produces one output per
# value; meta.yaml gives the nompi build a higher build number so the solver
# prefers it unless an MPI variant is explicitly requested.
#
# Verified 2026-07-15: pyscotch drives conda-forge's UNSUFFIXED ptscotch 7.0.11
# (int64) through mpi4py across multiple MPI ranks — build_grid_3d + check +
# part all succeed, for BOTH the openmpi and mpich variants. This is the
# parallel analogue of the sequential unsuffixed-symbol verification in
# meta.yaml.
mpi:
  - nompi
  - openmpi
  - mpich
